# Every terminal-features line below matches `xterm*` as well as `alacritty*`.
# alacritty is driven with TERM=alacritty via its `[env]` block; the xterm*
# half is kept so nothing degrades if that is ever pointed back at
# xterm-256color. Neither terminfo entry declares these capabilities, so tmux
# strips the feature entirely when no pattern matches -- silently, no error.
set -as terminal-features ",xterm*:RGB,alacritty*:RGB"
set -g mouse on
set -g default-terminal "tmux-256color"

# OSC 8 hyperlinks: alacritty and ghostty both emit them, but neither declares
# an `Hls` capability, so tmux cannot detect the feature and strips the
# sequences unless told about it.
set -as terminal-features ",xterm*:hyperlinks,alacritty*:hyperlinks"

# Pass Ctrl/Shift-modified keys through to applications that ask for them.
# Neovim negotiates the kitty keyboard protocol; without this tmux collapses
# Ctrl+Shift+P down to a plain ^P, so nvim mappings like <C-S-P> never fire.
# `on` (not `always`) forwards only to apps that request it, leaving everything
# else untouched. `extkeys` advertises that the outer terminal speaks the
# protocol, which is what lets tmux request it upstream.
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys,alacritty*:extkeys"

# Undercurl and coloured underlines (nvim diagnostics). alacritty renders both,
# and its terminfo carries `Smulx`, but tmux still flattens them to a plain
# underline unless `usstyle` is declared. xterm-256color lacks `Smulx` entirely,
# which is why this was doing nothing before the TERM switch.
set -as terminal-features ",xterm*:usstyle,alacritty*:usstyle"

# tmux declares clipboard/cursor support for `xterm*` out of the box but not
# for `alacritty*`, so switching TERM silently drops all three. alacritty does
# support them: OSC 52 (which `set-clipboard on` below relies on), DECSCUSR
# cursor shapes, and OSC 12 cursor colour.
set -as terminal-features ",alacritty*:clipboard:ccolour:cstyle"

# Let applications emit escape sequences tmux does not understand (DCS
# passthrough): image protocols such as image.nvim or yazi previews would
# otherwise be swallowed. Only does anything under a terminal with a graphics
# protocol -- ghostty has one, alacritty has none -- but is harmless without.
# The cost is that any pane can drive the outer terminal directly.
set -g allow-passthrough on

# `external` (the default) lets only tmux itself set the system clipboard, so
# OSC 52 from inside a pane is dropped -- which breaks nvim's clipboard over
# ssh. `on` forwards it instead.
set -g set-clipboard on

set -g status-position top

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind -n M-H previous-window
bind -n M-L next-window
bind -n S-Left previous-window
bind -n S-Right next-window

unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind \\ split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style "basic"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
# Reserve a gap before the right modules: tmux sizes status-right first and
# gives the window list whatever is left, so leading padding here survives even
# when long window titles fill the bar. bg=default falls back to status-style.
set -g status-right "#[bg=default]   "
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_peach}] #S "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_1}] %Y-%m-%d %H:%M "

run '~/.config/tmux/plugins/tpm/tpm'

# After TPM: vim-tmux-navigator rebinds prefix C-l to send-keys, so these must
# come later to win. Note this costs the plugin's clear-screen escape hatch.
bind-key C-h select-window -t :-
bind-key C-l select-window -t :+

# Configure Cmd-line message style after TPM to override Catppuccin defaults.
# fill= is what blanks the rest of the status line; without it the previous
# status content shows through around the prompt. align=left keeps the prompt
# in the corner (Catppuccin's default is align=centre).
set -gF message-style "fg=#{@thm_fg},bg=#{@thm_bg},align=left,fill=#{@thm_bg}"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_bg},align=left,fill=#{@thm_bg}"
