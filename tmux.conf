set-option -sa terminal-features ",xterm*:RGB"
set -g mouse on
set -g default-terminal "tmux-256color"

# OSC 8 hyperlinks: ghostty supports them, but declares no `Hls` capability, so
# tmux cannot detect the feature and strips the sequences unless told about it.
set-option -sa terminal-features ",xterm*:hyperlinks"

# Pass Ctrl/Shift-modified keys through to applications that ask for them.
# Neovim negotiates the kitty keyboard protocol; without this tmux collapses
# Ctrl+Shift+P down to a plain ^P, so nvim mappings like <C-S-P> never fire.
# `on` (not `always`) forwards only to apps that request it, leaving everything
# else untouched. `extkeys` advertises that the outer terminal -- ghostty here --
# speaks the protocol, which is what lets tmux request it upstream.
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

set -g status-position top

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind -n M-H previous-window
bind -n M-L next-window
bind -n S-Left previous-window
bind -n S-Right next-window

unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind \\ split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

run '~/.config/tmux/plugins/tpm/tpm'

# After TPM: vim-tmux-navigator rebinds prefix C-l to send-keys, so these must
# come later to win. Note this costs the plugin's clear-screen escape hatch.
bind-key C-h select-window -t :-
bind-key C-l select-window -t :+

# Configure Cmd-line message style after TPM to override Catppuccin defaults.
# fill= is what blanks the rest of the status line; without it the previous
# status content shows through around the prompt. align=left keeps the prompt
# in the corner (Catppuccin's default is align=centre).
set -gF message-style "fg=#{@thm_fg},bg=#{@thm_bg},align=left,fill=#{@thm_bg}"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_bg},align=left,fill=#{@thm_bg}"
